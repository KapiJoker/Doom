<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <title>DOOM Canvas Engine</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background-color: #050505; color: #ff0000;
      font-family: monospace; display: flex; flex-direction: column;
      justify-content: center; align-items: center; overflow: hidden;
    }
    canvas {
      border: 4px solid #333;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.2);
      background-color: #000;
    }
    #status { margin-top: 15px; color: #aaa; font-size: 14px; }
  </style>
</head>
<body>

  <canvas id="doomCanvas" width="640" height="400"></canvas>
  <div id="status">Inicjalizacja dekodera WAD...</div>

  <script src="game_engine.js"></script>

</body>
</html>
